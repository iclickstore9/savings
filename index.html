<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>กระปุกออม</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="กระปุกออม" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/prompt-thai-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="ย้อนกลับ" hidden><span data-ico="chevron-left"></span></button>
    <h1 id="title">กระปุกออม</h1>
    <button id="syncBadge" class="icon-btn sync-badge" hidden></button>
    <button id="menuBtn" class="icon-btn" aria-label="เมนู"><span data-ico="ellipsis-vertical"></span></button>
  </header>

  <main id="app"></main>

  <button id="fab" class="fab" aria-label="เพิ่ม"><span data-ico="plus"></span></button>

  <nav class="tabbar">
    <a href="#/" data-tab="save"><span data-ico="piggy-bank"></span><span>เงินออม</span></a>
    <a href="#/money" data-tab="money"><span data-ico="wallet-cards"></span><span>รายรับรายจ่าย</span></a>
  </nav>

  <!-- ฟอร์มรายรับ/รายจ่าย -->
  <dialog id="txnDialog">
    <form id="txnForm" method="dialog">
      <h2 id="txnDialogTitle">บันทึกรายจ่าย</h2>
      <div class="segmented">
        <label><input type="radio" name="ttype" value="expense" checked /><span>รายจ่าย</span></label>
        <label><input type="radio" name="ttype" value="income" /><span>รายรับ</span></label>
      </div>
      <label>จำนวนเงิน (บาท)
        <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00" />
      </label>
      <div class="field-label">หมวดหมู่</div>
      <div class="cat-grid" id="txnCats"></div>
      <input type="hidden" name="categoryId" />
      <label>วันที่
        <input name="date" type="date" required />
      </label>
      <label>โน้ต
        <input name="note" maxlength="100" placeholder="เช่น ข้าวเที่ยง, ค่าไฟ ต.ค." />
      </label>
      <p class="muted small" id="txnLinkInfo" hidden></p>
      <div class="actions">
        <button type="button" class="btn danger" id="txnDeleteBtn" hidden>ลบ</button>
        <button type="button" class="btn ghost" id="txnSkipBtn" hidden>ข้ามเดือนนี้</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- รายการประจำ: รายการ -->
  <dialog id="recDialog">
    <div class="menu" id="recBody"></div>
  </dialog>

  <!-- รายการประจำ: ฟอร์ม -->
  <dialog id="recFormDialog">
    <form id="recForm" method="dialog">
      <h2 id="recFormTitle">รายการประจำใหม่</h2>
      <div class="segmented">
        <label><input type="radio" name="rtype" value="expense" checked /><span>รายจ่ายประจำ</span></label>
        <label><input type="radio" name="rtype" value="income" /><span>รายรับประจำ</span></label>
      </div>
      <label>ชื่อ
        <input name="name" required maxlength="40" placeholder="เช่น ค่าเช่าห้อง, เงินเดือน" />
      </label>
      <div class="two-col">
        <label>จำนวนเงิน (บาท)
          <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0" />
        </label>
        <label>ทุกวันที่
          <input name="day" type="number" inputmode="numeric" min="1" max="31" step="1" required placeholder="1-31" />
        </label>
      </div>
      <div class="field-label">หมวดหมู่</div>
      <div class="cat-grid" id="recCats"></div>
      <input type="hidden" name="categoryId" />
      <div class="actions">
        <button type="button" class="btn danger" id="recDeleteBtn" hidden>ลบ</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- หมวดหมู่: รายการ -->
  <dialog id="catDialog">
    <div class="menu" id="catBody"></div>
  </dialog>

  <!-- หมวดหมู่: ฟอร์ม -->
  <dialog id="catFormDialog">
    <form id="catForm" method="dialog">
      <h2 id="catFormTitle">หมวดหมู่ใหม่</h2>
      <div class="segmented">
        <label><input type="radio" name="ctype" value="expense" checked /><span>รายจ่าย</span></label>
        <label><input type="radio" name="ctype" value="income" /><span>รายรับ</span></label>
      </div>
      <label>ชื่อ
        <input name="name" required maxlength="24" placeholder="เช่น กาแฟ, ค่าเทอมลูก" />
      </label>
      <div class="field-label">ไอคอน</div>
      <div class="emoji-row" id="catIconRow"></div>
      <input type="hidden" name="icon" />
      <div class="field-label">สี</div>
      <div class="color-row" id="catColorRow"></div>
      <input type="hidden" name="color" />
      <div class="actions">
        <button type="button" class="btn danger" id="catDeleteBtn" hidden>ลบ</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- ออมเงินที่เหลือ -->
  <dialog id="saveLeftDialog">
    <form id="saveLeftForm" method="dialog">
      <h2>ออมเงินที่เหลือ</h2>
      <p class="muted small" id="saveLeftInfo"></p>
      <label>เข้าเป้าหมาย
        <select name="goalId" required></select>
      </label>
      <label>จำนวนเงิน (บาท)
        <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required />
      </label>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn primary">ออมเลย</button>
      </div>
    </form>
  </dialog>

  <!-- ฟอร์มเป้าหมาย -->
  <dialog id="goalDialog">
    <form id="goalForm" method="dialog">
      <h2 id="goalDialogTitle">เป้าหมายใหม่</h2>
      <label>ชื่อ
        <input name="name" required maxlength="40" placeholder="เช่น สร้างบ้าน, จ่ายประกัน" />
      </label>
      <label>ไอคอน
        <div class="emoji-row" id="emojiRow"></div>
        <input type="hidden" name="icon" />
      </label>
      <label>เป้าหมาย (บาท) <small>ไม่ใส่ก็ได้</small>
        <input name="target" type="number" inputmode="decimal" min="0" step="0.01" placeholder="เช่น 500000" />
      </label>
      <label>สี
        <div class="color-row" id="colorRow"></div>
        <input type="hidden" name="color" />
      </label>
      <div class="actions">
        <button type="button" class="btn danger" id="goalDeleteBtn" hidden>ลบ</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- ฟอร์มรายการ -->
  <dialog id="entryDialog">
    <form id="entryForm" method="dialog">
      <h2 id="entryDialogTitle">บันทึกรายการ</h2>
      <div class="segmented">
        <label><input type="radio" name="type" value="in" checked /><span>ฝากเข้า</span></label>
        <label><input type="radio" name="type" value="out" /><span>ถอนออก</span></label>
      </div>
      <label>เป้าหมาย
        <select name="goalId" required></select>
      </label>
      <label>จำนวนเงิน (บาท)
        <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00" />
      </label>
      <label>วันที่
        <input name="date" type="date" required />
      </label>
      <label>โน้ต
        <textarea name="note" rows="2" maxlength="300" placeholder="เช่น โบนัสสิ้นปี"></textarea>
      </label>
      <div class="actions">
        <button type="button" class="btn danger" id="entryDeleteBtn" hidden>ลบ</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <!-- เมนู -->
  <dialog id="menuDialog">
    <div class="menu">
      <h2>ข้อมูล</h2>

      <div id="syncSection" class="sync-box" hidden>
        <div class="sync-head">
          <span data-ico="cloud"></span>
          <b>ซิงก์ข้อมูล</b>
          <span id="syncStatus" class="sync-status"></span>
        </div>
        <p id="syncInfo" class="muted small"></p>
        <button class="btn block primary-soft" id="loginBtn" hidden><span data-ico="log-in"></span> เข้าสู่ระบบด้วย Google</button>
        <button class="btn block" id="logoutBtn" hidden><span data-ico="log-out"></span> ออกจากระบบ</button>
      </div>

      <p class="muted" id="localNote">ข้อมูลเก็บไว้ในเครื่องนี้เท่านั้น ควร Export สำรองเป็นระยะ</p>
      <button class="btn block" id="exportBtn"><span data-ico="download"></span> Export สำรองข้อมูล (.json)</button>
      <button class="btn block" id="importBtn"><span data-ico="upload"></span> Import จากไฟล์สำรอง</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
      <button class="btn block danger" id="resetBtn"><span data-ico="trash-2"></span> ลบข้อมูลทั้งหมด</button>
      <div class="actions"><span class="muted small" id="appVersion"></span><span class="spacer"></span><button class="btn ghost" data-close>ปิด</button></div>
    </div>
  </dialog>

  <!-- คาดการณ์ -->
  <dialog id="planDialog">
    <div class="menu" id="planBody"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="icons.js"></script>
  <script src="plan.js"></script>
  <script src="money.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
